name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The release job gates on this. Two workflows independently triggered by the
  # same push would let a red commit be versioned, tagged and published — and a
  # tag that rode a broken release cannot be cleanly withdrawn.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub releases
      issues: write
      pull-requests: write
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node 24: @semantic-release/npm 13 requires ^22.14.0 || >=24.10.0, and
      # trusted publishing requires npm >= 11.5.1. `registry-url` is what makes
      # setup-node write the .npmrc that the OIDC exchange needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Fail here with a clear reason
      # rather than at publish time, where the error is an opaque auth failure.
      - name: Verify npm supports trusted publishing
        run: |
          set -euo pipefail
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          MIN=11.5.1
          if [ "$(printf '%s\n' "$MIN" "$NPM_VERSION" | sort -V | head -1)" != "$MIN" ]; then
            echo "::error::npm >= $MIN is required for trusted publishing; runner has $NPM_VERSION"
            exit 1
          fi

      - run: npm ci

      # Auth resolves itself, in this order:
      #   1. npm trusted publishing (OIDC) — the job's id-token is exchanged for
      #      a short-lived credential, and provenance is automatic.
      #   2. NPM_TOKEN, only if the OIDC exchange fails.
      #
      # npm cannot mint an OIDC credential for a package that does not exist yet
      # (a trusted publisher is configured ON a package), so the FIRST publish
      # needs a token. After that, delete the NPM_TOKEN secret: an unset secret
      # is an empty string, the plugin treats that as absent, and the job is
      # OIDC-only with no standing credential. No code change needed to switch.
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release creates and pushes the version tag BEFORE it publishes,
      # so a publish that fails leaves an orphaned tag pointing at an unreleased
      # version. The next run then reads that tag as "already released", reports
      # no new version, and never retries — the release is silently wedged until
      # someone deletes the tag by hand. This happened once; hence the cleanup.
      - name: Remove the tag an unpublished release left behind
        if: failure() && steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          git fetch --tags --quiet origin
          # Newest tag reachable from HEAD, if any.
          TAG=$(git tag --points-at HEAD | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "No tag on HEAD — nothing to unwind."; exit 0
          fi
          VERSION="${TAG#v}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION IS on the registry — $TAG is real, keeping it."; exit 0
          fi
          echo "::warning::$TAG was pushed but $NAME@$VERSION never reached the registry. Deleting the orphaned tag so the next run can retry."
          # Deleted through the API, NOT by pushing to a credential-bearing URL.
          # A token in a remote URL is persisted into .git/config and leaks from
          # every tool that prints remotes — this repo ships a rule banning it.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
